AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  lambda-http-proxy — a pure pass-through HTTP proxy that forwards SigV4-signed
  requests verbatim and STREAMS the upstream response back to the caller.
  Response streaming is the only supported mode: the function never buffers or
  collects response data.

Parameters:
  TargetScheme:
    Type: String
    Default: https
    AllowedValues: [https]
    Description: >
      Upstream scheme. Locked to https — real AWS endpoints are always TLS and
      SigV4 is verified against the signed Host over TLS.

Resources:
  ProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-http-proxy
      Runtime: nodejs24.x
      Handler: lambda-http-proxy.handler
      CodeUri: dist/
      MemorySize: 512
      # Streaming responses can run long; the proxy lifetime tracks the upstream.
      Timeout: 900
      Architectures:
        - arm64
      Environment:
        Variables:
          PROXY_TARGET_SCHEME: !Ref TargetScheme
      FunctionUrlConfig:
        AuthType: AWS_IAM
        # RESPONSE_STREAM is the ONLY mode. The function streams every byte of
        # the upstream response straight to the caller and never buffers.
        InvokeMode: RESPONSE_STREAM

  # Explicit URL resource is unnecessary with FunctionUrlConfig above; SAM
  # creates the AWS::Lambda::Url with the specified InvokeMode.

Outputs:
  FunctionUrl:
    Description: HTTPS endpoint for the streaming proxy
    Value: !GetAtt ProxyFunctionUrl.FunctionUrl
  FunctionArn:
    Description: Proxy function ARN
    Value: !GetAtt ProxyFunction.Arn
